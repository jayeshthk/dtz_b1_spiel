<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DTZ B1 Vokabeltrainer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #333;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        flex: 1;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
        color: white;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        animation: fadeInDown 0.8s ease-out;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .control-label {
        color: white;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .language-selector,
      .dataset-selector {
        padding: 8px 15px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 1rem;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .language-selector:hover,
      .dataset-selector:hover,
      .language-selector:focus,
      .dataset-selector:focus {
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.3);
        outline: none;
      }

      .language-selector option,
      .dataset-selector option {
        background: #2c3e50;
        color: white;
      }

      .progress-container {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 0.8s ease-out;
      }

      .stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .stat {
        text-align: center;
        color: white;
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        min-width: 120px;
        backdrop-filter: blur(5px);
      }

      .stat-number {
        font-size: 1.8rem;
        font-weight: bold;
        display: block;
      }

      .stat-label {
        font-size: 0.9rem;
        opacity: 0.9;
      }

      .progress-bar {
        width: 100%;
        height: 12px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        overflow: hidden;
        margin-top: 15px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #00f260, #0575e6);
        border-radius: 6px;
        transition: width 0.5s ease;
        width: 0%;
      }

      .game-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
        animation: slideInUp 0.6s ease-out;
        position: relative;
        overflow: hidden;
      }

      .game-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }

      #word {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 30px 0;
        color: #2c3e50;
        text-align: center;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 0.6s ease-in-out;
      }

      .sentence-container {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin: 20px 0;
        border-left: 4px solid #667eea;
        font-style: italic;
        color: #495057;
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 30px 0;
      }

      .choices button {
        padding: 18px 25px;
        font-size: 1.1rem;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        cursor: pointer;
        background: linear-gradient(145deg, #f8f9fa, #e9ecef);
        color: #495057;
        transition: all 0.3s ease;
        font-weight: 500;
        position: relative;
        overflow: hidden;
        text-align: center;
        word-wrap: break-word;
      }

      .choices button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        border-color: #667eea;
      }

      .choices button:active {
        transform: translateY(0);
      }

      .choices button.correct {
        background: linear-gradient(145deg, #d4edda, #c3e6cb);
        border-color: #28a745;
        color: #155724;
        animation: correctPulse 0.6s ease;
      }

      .choices button.incorrect {
        background: linear-gradient(145deg, #f8d7da, #f1aeb5);
        border-color: #dc3545;
        color: #721c24;
        animation: shake 0.6s ease;
      }

      .choices button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }

      #feedback {
        text-align: center;
        font-size: 1.3rem;
        margin: 25px 0;
        font-weight: 600;
        min-height: 30px;
        animation: fadeIn 0.5s ease;
      }

      .feedback-correct {
        color: #28a745;
      }

      .feedback-incorrect {
        color: #dc3545;
      }

      #next {
        background: linear-gradient(145deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.1rem;
        border-radius: 10px;
        cursor: pointer;
        display: none;
        margin: 20px auto;
        transition: all 0.3s ease;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      #next:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      .achievement {
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(145deg, #ffd700, #ffed4e);
        color: #333;
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        transform: translateX(300px);
        transition: transform 0.5s ease;
        z-index: 1000;
        font-weight: bold;
      }

      .achievement.show {
        transform: translateX(0);
      }

      .streak-counter {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 1.1rem;
        color: #ff6b6b;
        font-weight: bold;
      }

      .completion-card {
        text-align: center;
        padding: 40px;
        background: linear-gradient(145deg, #667eea, #764ba2);
        color: white;
        border-radius: 20px;
        margin: 20px 0;
      }

      .completion-emoji {
        font-size: 4rem;
        margin-bottom: 20px;
        animation: bounce 1s infinite;
      }

      /* Support Section */
      .support-section {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        padding: 30px;
        margin-top: 40px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .support-title {
        text-align: center;
        font-size: 1.8rem;
        color: #2c3e50;
        margin-bottom: 25px;
        font-weight: bold;
      }

      .support-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        align-items: start;
      }

      .coffee-section,
      .feedback-section {
        text-align: center;
      }

      .coffee-btn {
        background: linear-gradient(145deg, #ff6b6b, #ee5a24);
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 50px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      }

      .coffee-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
      }

      .feedback-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .feedback-input {
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
        resize: vertical;
        min-height: 100px;
      }

      .feedback-input:focus {
        outline: none;
        border-color: #667eea;
      }

      .feedback-submit {
        background: linear-gradient(145deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
      }

      .feedback-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      /* Animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes correctPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        .header h1 {
          font-size: 2rem;
        }

        .choices {
          grid-template-columns: 1fr;
        }

        .stats {
          justify-content: center;
        }

        .support-content {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        #word {
          font-size: 2rem;
        }

        .controls {
          flex-direction: column;
          align-items: center;
        }
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
      }

      .spinner {
        border: 4px solid rgba(102, 126, 234, 0.3);
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎯 DTZ B1 Vokabeltrainer</h1>
        <p>Meistere deutsche Vokabeln spielerisch!</p>
      </div>

      <div class="controls">
        <div class="control-group">
          <label class="control-label">Sprache / Language</label>
          <select class="language-selector" id="languageSelector">
            <option value="en">🇬🇧 English</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="ar">🇸🇦 العربية</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Übungsart / Exercise Type</label>
          <select class="dataset-selector" id="datasetSelector">
            <option value="vocabulary">📚 Vokabeln / Vocabulary</option>
            <option value="grammar">📝 Grammatik / Grammar (German)</option>
          </select>
        </div>
      </div>

      <div class="progress-container">
        <div class="stats">
          <div class="stat">
            <span class="stat-number" id="currentWord">0</span>
            <span class="stat-label">Aktuell</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="totalWords">0</span>
            <span class="stat-label">Gesamt</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="correctCount">0</span>
            <span class="stat-label">Richtig</span>
          </div>
          <div class="stat">
            <span class="stat-number streak-counter" id="streak">🔥 0</span>
            <span class="stat-label">Serie</span>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="game-card">
        <div id="word" class="loading">
          <div class="spinner"></div>
        </div>
        <div
          id="sentenceContainer"
          class="sentence-container"
          style="display: none"
        ></div>
        <div class="choices"></div>
        <div id="feedback"></div>
        <button id="next">Weiter →</button>
      </div>

      <div class="support-section">
        <h2 class="support-title">💝 Unterstütze dieses Projekt</h2>
        <div class="support-content">
          <div class="coffee-section">
            <h3>☕ Kauf mir einen Kaffee</h3>
            <p>Gefällt dir der Vokabeltrainer? Unterstütze die Entwicklung!</p>
            <a
              href="https://www.paypal.com/paypalme/SnehasishMistri2025"
              class="coffee-btn"
              target="_blank"
            >
              ☕ Kaffee spendieren
            </a>
          </div>

          <div class="feedback-section">
            <h3>💭 Dein Feedback</h3>
            <form class="feedback-form" id="feedbackForm">
              <textarea
                class="feedback-input"
                placeholder="Teile deine Gedanken, Vorschläge oder Ideen mit uns..."
                id="feedbackText"
              ></textarea>
              <button type="submit" class="feedback-submit">
                Feedback senden
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="achievement" id="achievement"></div>

    <script>
      let vocab = [];
      let currentIndex = 0;
      let correctAnswers = 0;
      let streak = 0;
      let maxStreak = 0;
      let currentLanguage = "en";
      let currentDataset = "vocabulary";

      const wordEl = document.getElementById("word");
      const sentenceEl = document.getElementById("sentenceContainer");
      const choicesEl = document.querySelector(".choices");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("next");
      const achievementEl = document.getElementById("achievement");
      const languageSelector = document.getElementById("languageSelector");
      const datasetSelector = document.getElementById("datasetSelector");

      // Stats elements
      const currentWordEl = document.getElementById("currentWord");
      const totalWordsEl = document.getElementById("totalWords");
      const correctCountEl = document.getElementById("correctCount");
      const streakEl = document.getElementById("streak");
      const progressFillEl = document.getElementById("progressFill");

      // Dataset URLs
      const datasets = {
        vocabulary: "merged", // Special flag to indicate merged dataset
        grammar:
          "https://s3.ap-south-1.amazonaws.com/qubric.in/data/deutsch_artikel.json",
      };

      // Individual dataset URLs for merging
      const vocabularyDatasets = {
        vocabulary_1:
          "https://s3.ap-south-1.amazonaws.com/qubric.in/data/deutsch_ubung.json",
        vocabulary_2:
          "https://s3.ap-south-1.amazonaws.com/qubric.in/data/deu_eng.json",
      };
      function normalizeVocabularyItem(item, source) {
        if (source === "vocabulary_1") {
          // vocabulary_1 structure: {word, correct, correct_ru, correct_ar, options, options_ru, options_ar, sentence}
          return {
            word: item.word,
            correct: item.correct,
            correct_ru: item.correct_ru,
            correct_ar: item.correct_ar,
            options: item.options,
            options_ru: item.options_ru,
            options_ar: item.options_ar,
            sentence: item.sentence,
            source: "vocabulary_1",
          };
        } else if (source === "vocabulary_2") {
          // vocabulary_2 structure: {word, correct, options} - only English
          return {
            word: item.word,
            correct: item.correct,
            correct_ru: item.correct, // Fallback to English if no Russian
            correct_ar: item.correct, // Fallback to English if no Arabic
            options: item.options,
            options_ru: item.options, // Fallback to English options
            options_ar: item.options, // Fallback to English options
            sentence: item.sentence || null,
            source: "vocabulary_2",
          };
        }
        return item;
      }
      function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
      }

      function updateStats() {
        currentWordEl.textContent = currentIndex + 1;
        totalWordsEl.textContent = vocab.length;
        correctCountEl.textContent = correctAnswers;
        streakEl.textContent = `🔥 ${streak}`;

        const progress = ((currentIndex + 1) / vocab.length) * 100;
        progressFillEl.style.width = `${progress}%`;
      }

      function showAchievement(text) {
        achievementEl.textContent = text;
        achievementEl.classList.add("show");
        setTimeout(() => {
          achievementEl.classList.remove("show");
        }, 3000);
      }

      function checkAchievements() {
        if (streak === 5) {
          showAchievement("🔥 5er-Serie! Du bist auf Feuer!");
        } else if (streak === 10) {
          showAchievement("⚡ 10er-Serie! Unglaublich!");
        } else if (streak === 20) {
          showAchievement("🚀 20er-Serie! Du bist ein Vokabel-Meister!");
        }

        if (correctAnswers === 10) {
          showAchievement("🎯 10 richtige Antworten erreicht!");
        } else if (correctAnswers === 25) {
          showAchievement("🌟 25 richtige Antworten! Fantastisch!");
        }
      }

      function showWord() {
        if (currentIndex >= vocab.length) return;

        feedbackEl.textContent = "";
        feedbackEl.className = "";
        nextBtn.style.display = "none";

        const item = vocab[currentIndex];

        if (currentDataset === "vocabulary") {
          // Structure 1: Vocabulary
          wordEl.textContent = item.word;

          // Show sentence if available
          if (item.sentence) {
            sentenceEl.textContent = `Beispiel: ${item.sentence}`;
            sentenceEl.style.display = "block";
          } else {
            sentenceEl.style.display = "none";
          }

          // Get correct answer and options based on language
          let correctAnswer, options;

          switch (currentLanguage) {
            case "ru":
              correctAnswer = item.correct_ru;
              options = item.options_ru || item.options;
              break;
            case "ar":
              correctAnswer = item.correct_ar;
              options = item.options_ar || item.options;
              break;
            default:
              correctAnswer = item.correct;
              options = item.options;
              break;
          }

          item.currentCorrect = correctAnswer;

          choicesEl.innerHTML = "";
          shuffle([...options]).forEach((option) => {
            const btn = document.createElement("button");
            btn.textContent = option;
            btn.onclick = () => selectAnswer(btn, option === correctAnswer);
            choicesEl.appendChild(btn);
          });
        } else {
          // Structure 2: Grammar
          wordEl.textContent = item.word;

          // Show sentence with blank
          if (item.sentence) {
            sentenceEl.innerHTML = item.sentence.replace(
              /___ /g,
              '<strong style="color: #667eea;">___ </strong>'
            );
            sentenceEl.style.display = "block";
          } else {
            sentenceEl.style.display = "none";
          }

          item.currentCorrect = item.true;

          choicesEl.innerHTML = "";
          shuffle([...item.options]).forEach((option) => {
            const btn = document.createElement("button");
            btn.textContent = option;
            btn.onclick = () => selectAnswer(btn, option === item.true);
            choicesEl.appendChild(btn);
          });
        }

        wordEl.className = "";
        updateStats();
      }

      function selectAnswer(button, isCorrect) {
        const buttons = document.querySelectorAll(".choices button");
        buttons.forEach((btn) => (btn.disabled = true));

        if (isCorrect) {
          button.classList.add("correct");
          feedbackEl.textContent = "✅ Richtig!";
          feedbackEl.className = "feedback-correct";
          correctAnswers++;
          streak++;
          checkAchievements();
        } else {
          button.classList.add("incorrect");
          feedbackEl.textContent = `❌ Falsch! Richtige Antwort: ${vocab[currentIndex].currentCorrect}`;
          feedbackEl.className = "feedback-incorrect";
          streak = 0;
        }

        maxStreak = Math.max(maxStreak, streak);
        nextBtn.style.display = "inline-block";
        updateStats();
      }

      nextBtn.onclick = () => {
        currentIndex++;
        if (currentIndex < vocab.length) {
          showWord();
        } else {
          showCompletion();
        }
      };

      function showCompletion() {
        const accuracy = Math.round((correctAnswers / vocab.length) * 100);

        wordEl.innerHTML = `
        <div class="completion-card">
          <div class="completion-emoji">🎉</div>
          <h2>Herzlichen Glückwunsch!</h2>
          <p>Du hast alle ${vocab.length} Aufgaben geübt.</p>
          <p><strong>Genauigkeit: ${accuracy}%</strong></p>
          <p><strong>Längste Serie: ${maxStreak}</strong></p>
          <button onclick="restartGame()" style="margin-top: 20px; padding: 12px 24px; background: white; color: #667eea; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
            🔄 Nochmal spielen
          </button>
        </div>
      `;

        choicesEl.innerHTML = "";
        sentenceEl.style.display = "none";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";

        if (accuracy >= 90) {
          showAchievement("🏆 Perfekte Leistung! 90%+ Genauigkeit!");
        } else if (accuracy >= 75) {
          showAchievement("⭐ Großartige Arbeit! 75%+ Genauigkeit!");
        }
      }

      function restartGame() {
        currentIndex = 0;
        correctAnswers = 0;
        streak = 0;
        maxStreak = 0;
        vocab.sort(() => 0.5 - Math.random());
        showWord();
      }
      async function loadDatasetWithProgress() {
        wordEl.innerHTML =
          '<div class="loading"><div class="spinner"></div><p>Lade Vokabeln...</p></div>';
        choicesEl.innerHTML = "";
        sentenceEl.style.display = "none";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";

        try {
          if (currentDataset === "vocabulary") {
            // Show progress
            wordEl.innerHTML =
              '<div class="loading"><div class="spinner"></div><p>Lade Vokabeldatensätze (1/2)...</p></div>';

            const vocab1Response = await fetch(vocabularyDatasets.vocabulary_1);
            const vocab1Data = await vocab1Response.json();

            wordEl.innerHTML =
              '<div class="loading"><div class="spinner"></div><p>Lade Vokabeldatensätze (2/2)...</p></div>';

            const vocab2Response = await fetch(vocabularyDatasets.vocabulary_2);
            const vocab2Data = await vocab2Response.json();

            wordEl.innerHTML =
              '<div class="loading"><div class="spinner"></div><p>Zusammenführen der Daten...</p></div>';

            // Normalize and merge
            const normalizedVocab1 = vocab1Data.map((item) =>
              normalizeVocabularyItem(item, "vocabulary_1")
            );
            const normalizedVocab2 = vocab2Data.map((item) =>
              normalizeVocabularyItem(item, "vocabulary_2")
            );

            vocab = [...normalizedVocab1, ...normalizedVocab2];
            vocab.sort(() => 0.5 - Math.random());
          } else {
            const response = await fetch(datasets[currentDataset]);
            vocab = await response.json();
            vocab.sort(() => 0.5 - Math.random());
          }

          currentIndex = 0;
          correctAnswers = 0;
          streak = 0;
          maxStreak = 0;
          totalWordsEl.textContent = vocab.length;
          showWord();
        } catch (error) {
          wordEl.innerHTML = `
      <div style="color: #dc3545; text-align: center;">
        <h3>⚠️ Fehler beim Laden</h3>
        <p>Die Daten konnten nicht geladen werden.</p>
        <button onclick="loadDataset()" style="margin-top: 15px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
          🔄 Neu laden
        </button>
      </div>
    `;
          console.error("Fehler beim Laden:", error);
        }
      }

      async function loadDataset() {
        wordEl.innerHTML =
          '<div class="loading"><div class="spinner"></div></div>';
        choicesEl.innerHTML = "";
        sentenceEl.style.display = "none";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";

        try {
          if (currentDataset === "vocabulary") {
            // Load and merge both vocabulary datasets
            const [vocab1Response, vocab2Response] = await Promise.all([
              fetch(vocabularyDatasets.vocabulary_1),
              fetch(vocabularyDatasets.vocabulary_2),
            ]);

            const [vocab1Data, vocab2Data] = await Promise.all([
              vocab1Response.json(),
              vocab2Response.json(),
            ]);

            // Normalize and merge the datasets
            const normalizedVocab1 = vocab1Data.map((item) =>
              normalizeVocabularyItem(item, "vocabulary_1")
            );
            const normalizedVocab2 = vocab2Data.map((item) =>
              normalizeVocabularyItem(item, "vocabulary_2")
            );

            // Combine and shuffle
            vocab = [...normalizedVocab1, ...normalizedVocab2];
            vocab.sort(() => 0.5 - Math.random());
          } else {
            // Load grammar dataset normally
            const response = await fetch(datasets[currentDataset]);
            vocab = await response.json();
            vocab.sort(() => 0.5 - Math.random());
          }

          // Reset game state
          currentIndex = 0;
          correctAnswers = 0;
          streak = 0;
          maxStreak = 0;
          totalWordsEl.textContent = vocab.length;
          showWord();
        } catch (error) {
          wordEl.innerHTML = `
      <div style="color: #dc3545; text-align: center;">
        <h3>⚠️ Fehler beim Laden</h3>
        <p>Die Daten konnten nicht geladen werden.</p>
        <button onclick="loadDataset()" style="margin-top: 15px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
          🔄 Neu laden
        </button>
      </div>
    `;
          console.error("Fehler beim Laden:", error);
        }
      }
      // Event listeners
      languageSelector.addEventListener("change", (e) => {
        currentLanguage = e.target.value;
        if (currentDataset === "vocabulary" && vocab.length > 0) {
          showWord(); // Refresh current word with new language
        }
      });

      datasetSelector.addEventListener("change", (e) => {
        currentDataset = e.target.value;
        loadDataset();
      });

      // Feedback form handler
      document
        .getElementById("feedbackForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const feedbackText = document
            .getElementById("feedbackText")
            .value.trim();
          const submitBtn = document.querySelector(".feedback-submit");

          if (!feedbackText) {
            alert("Bitte gib dein Feedback ein.");
            return;
          }

          // Disable button and show loading
          submitBtn.disabled = true;
          submitBtn.textContent = "Wird gesendet...";

          try {
            // Use FormData to avoid CORS issues
            const formData = new FormData();
            formData.append("feedback", feedbackText);
            formData.append("userAgent", navigator.userAgent);
            formData.append("url", window.location.href);

            // Replace 'YOUR_GOOGLE_APPS_SCRIPT_URL' with your actual script URL
            const response = await fetch("YOUR_GOOGLE_APPS_SCRIPT_URL", {
              method: "POST",
              body: formData,
            });

            const result = await response.json();

            if (result.status === "success") {
              // Show success animation
              submitBtn.style.background =
                "linear-gradient(145deg, #28a745, #20c997)";
              submitBtn.textContent = "✅ Gesendet!";

              setTimeout(() => {
                alert("Vielen Dank für dein Feedback! 🙏");
                document.getElementById("feedbackText").value = "";
                submitBtn.style.background =
                  "linear-gradient(145deg, #667eea, #764ba2)";
                submitBtn.textContent = "Feedback senden";
              }, 1000);
            } else {
              throw new Error(result.message || "Unbekannter Fehler");
            }
          } catch (error) {
            console.error("Feedback error:", error);

            // Try alternative method using URL parameters (GET request)
            try {
              const params = new URLSearchParams({
                feedback: feedbackText,
                userAgent: navigator.userAgent,
                url: window.location.href,
              });

              const fallbackResponse = await fetch(
                `https://script.google.com/macros/s/AKfycbyLGTvdPfhPggCc9jpYzcYtEfpWPj1QR_8u5Z1TGMDQikvUFAYR8RKai9DPlNLB76Jb/exec?${params.toString()}`
              );
              const fallbackResult = await fallbackResponse.json();

              if (fallbackResult.status === "success") {
                alert("Vielen Dank für dein Feedback! 🙏");
                document.getElementById("feedbackText").value = "";
              } else {
                throw new Error("Fallback failed");
              }
            } catch (fallbackError) {
              console.error("Fallback error:", fallbackError);
              alert(
                "Fehler beim Senden des Feedbacks. Bitte versuche es später erneut."
              );
            }
          } finally {
            // Re-enable button
            submitBtn.disabled = false;
            if (submitBtn.textContent !== "✅ Gesendet!") {
              submitBtn.textContent = "Feedback senden";
            }
          }
        });

      // Initialize the app
      loadDataset();
    </script>
  </body>
