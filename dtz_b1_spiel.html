<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DTZ B1 Trainer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #333;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        flex: 1;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
        color: white;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        animation: fadeInDown 0.8s ease-out;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .control-label {
        color: white;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .language-selector,
      .dataset-selector {
        padding: 8px 15px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 1rem;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .language-selector:hover,
      .dataset-selector:hover,
      .language-selector:focus,
      .dataset-selector:focus {
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.3);
        outline: none;
      }

      .language-selector option,
      .dataset-selector option {
        background: #2c3e50;
        color: white;
      }

      .progress-container {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 0.8s ease-out;
      }

      .stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .stat {
        text-align: center;
        color: white;
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        min-width: 120px;
        backdrop-filter: blur(5px);
      }

      .stat-number {
        font-size: 1.8rem;
        font-weight: bold;
        display: block;
      }

      .stat-label {
        font-size: 0.9rem;
        opacity: 0.9;
      }

      .progress-bar {
        width: 100%;
        height: 12px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        overflow: hidden;
        margin-top: 15px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #00f260, #0575e6);
        border-radius: 6px;
        transition: width 0.5s ease;
        width: 0%;
      }

      .game-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
        animation: slideInUp 0.6s ease-out;
        position: relative;
        overflow: hidden;
      }

      .game-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }

      #word {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 30px 0;
        color: #2c3e50;
        text-align: center;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 0.6s ease-in-out;
      }

      .sentence-container {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin: 20px 0;
        border-left: 4px solid #667eea;
        font-style: italic;
        color: #495057;
        font-size: 1.2rem; /* Added this line - increased from default */
        line-height: 1.5; /* Added this line for better readability */
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 30px 0;
      }

      .choices button {
        padding: 18px 25px;
        font-size: 1.1rem;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        cursor: pointer;
        background: linear-gradient(145deg, #f8f9fa, #e9ecef);
        color: #495057;
        transition: all 0.3s ease;
        font-weight: 500;
        position: relative;
        overflow: hidden;
        text-align: center;
        word-wrap: break-word;
      }

      .choices button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        border-color: #667eea;
      }

      .choices button:active {
        transform: translateY(0);
      }

      .choices button.correct {
        background: linear-gradient(145deg, #d4edda, #c3e6cb);
        border-color: #28a745;
        color: #155724;
        animation: correctPulse 0.6s ease;
      }

      .choices button.incorrect {
        background: linear-gradient(145deg, #f8d7da, #f1aeb5);
        border-color: #dc3545;
        color: #721c24;
        animation: shake 0.6s ease;
      }

      .choices button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }

      #feedback {
        text-align: center;
        font-size: 1.3rem;
        margin: 25px 0;
        font-weight: 600;
        min-height: 30px;
        animation: fadeIn 0.5s ease;
      }

      .feedback-correct {
        color: #28a745;
      }

      .feedback-incorrect {
        color: #dc3545;
      }

      #next {
        background: linear-gradient(145deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.1rem;
        border-radius: 10px;
        cursor: pointer;
        display: none;
        margin: 20px auto;
        transition: all 0.3s ease;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      #next:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      .achievement {
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(145deg, #ffd700, #ffed4e);
        color: #333;
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        transform: translateX(300px);
        transition: transform 0.5s ease;
        z-index: 1000;
        font-weight: bold;
      }

      .achievement.show {
        transform: translateX(0);
      }

      .streak-counter {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 1.1rem;
        color: #ff6b6b;
        font-weight: bold;
      }

      .completion-card {
        text-align: center;
        padding: 40px;
        background: linear-gradient(145deg, #667eea, #764ba2);
        color: white;
        border-radius: 20px;
        margin: 20px 0;
      }

      .completion-emoji {
        font-size: 4rem;
        margin-bottom: 20px;
        animation: bounce 1s infinite;
      }

      /* Support Section */
      .support-section {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        padding: 30px;
        margin-top: 40px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .support-title {
        text-align: center;
        font-size: 1.8rem;
        color: #2c3e50;
        margin-bottom: 25px;
        font-weight: bold;
      }

      .support-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        align-items: start;
      }

      .coffee-section,
      .feedback-section {
        text-align: center;
      }

      .coffee-btn {
        background: linear-gradient(145deg, #ff6b6b, #ee5a24);
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 50px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      }

      .coffee-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
      }

      .feedback-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .feedback-input {
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
        resize: vertical;
        min-height: 100px;
      }

      .feedback-input:focus {
        outline: none;
        border-color: #667eea;
      }

      .feedback-submit {
        background: linear-gradient(145deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
      }

      .feedback-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      /* Animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes correctPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .sentence-container {
          font-size: 1.1rem; /* Slightly smaller on mobile but still larger than default */
          line-height: 1.4;
        }
        .container {
          padding: 15px;
        }

        .header h1 {
          font-size: 2rem;
        }

        .choices {
          grid-template-columns: 1fr;
        }

        .stats {
          justify-content: center;
        }

        .support-content {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        #word {
          font-size: 2rem;
        }

        .controls {
          flex-direction: column;
          align-items: center;
        }
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
      }

      .spinner {
        border: 4px solid rgba(102, 126, 234, 0.3);
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>DTZ B1 Trainer</h1>
        <p>Meistere deutsche Vokabeln spielerisch!</p>
      </div>

      <div class="controls">
        <div class="control-group">
          <label class="control-label">Sprache / Language</label>
          <select class="language-selector" id="languageSelector">
            <option value="en">🇬🇧 English</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="ar">🇸🇦 العربية</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Übungsart / Exercise Type</label>
          <select class="dataset-selector" id="datasetSelector">
            <option value="vocabulary">📚 Vokabeln / Vocabulary</option>
            <option value="grammar">📝 Grammatik / Grammar (German)</option>
          </select>
        </div>
      </div>

      <div class="progress-container">
        <div class="stats">
          <div class="stat">
            <span class="stat-number" id="currentWord">0</span>
            <span class="stat-label">Aktuell</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="totalWords">0</span>
            <span class="stat-label">Gesamt</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="correctCount">0</span>
            <span class="stat-label">Richtig</span>
          </div>
          <div class="stat">
            <span class="stat-number streak-counter" id="streak">🔥 0</span>
            <span class="stat-label">Serie</span>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="game-card">
        <div id="word" class="loading">
          <div class="spinner"></div>
        </div>
        <div
          id="sentenceContainer"
          class="sentence-container"
          style="display: none"
        ></div>
        <div class="choices"></div>
        <div id="feedback"></div>
        <button id="next">Weiter →</button>
      </div>

      <div class="support-section">
        <h2 class="support-title">💝 Unterstütze dieses Projekt</h2>
        <div class="support-content">
          <div class="coffee-section">
            <h3>☕ Kauf mir einen Kaffee</h3>
            <p>Gefällt dir der Vokabeltrainer? Unterstütze die Entwicklung!</p>
            <a
              href="https://www.paypal.com/paypalme/SnehasishMistri2025"
              class="coffee-btn"
              target="_blank"
            >
              ☕ Kaffee spendieren
            </a>
          </div>

          <div class="feedback-section">
            <h3>💭 Dein Feedback</h3>
            <form class="feedback-form" id="feedbackForm">
              <textarea
                class="feedback-input"
                placeholder="Teile deine Gedanken, Vorschläge oder Ideen mit uns..."
                id="feedbackText"
              ></textarea>
              <button type="submit" class="feedback-submit">
                Feedback senden
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="achievement" id="achievement"></div>

    <script src="app.min.js"></script>
  </body>
</html>
